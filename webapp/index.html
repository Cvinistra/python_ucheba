<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Python Academy</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#0b1220);
  --card:var(--tg-theme-secondary-bg-color,#111c30);
  --text:var(--tg-theme-text-color,#f8fafc);
  --hint:var(--tg-theme-hint-color,#94a3b8);
  --accent:var(--tg-theme-button-color,#2481cc);
  --accentText:var(--tg-theme-button-text-color,#fff);
  --line:rgba(148,163,184,.16);
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:98px}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;position:sticky;top:0;padding-top:4px;background:linear-gradient(var(--bg) 85%,transparent);z-index:10}
.brand{font-weight:900;font-size:20px}
.user{color:var(--hint);font-size:12px;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero,.card,.lesson,.cmd-card,.code-card,.user-card,.stat,.support-card,.ticket,.learn-block{background:var(--card);border:1px solid var(--line);border-radius:18px}
.hero{padding:18px;margin-bottom:12px}
.hero h1,.hero h2,.hero h3{margin-top:0}
.hero p,.card p,.small,.muted{color:var(--hint)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{padding:15px;min-height:108px}
.clickable{cursor:pointer}
.card h3{margin:0 0 8px;font-size:16px}
.badge{display:inline-block;background:rgba(36,129,204,.15);color:var(--accent);padding:5px 8px;border-radius:999px;font-size:11px}
.section-head{display:flex;align-items:center;gap:9px;margin:7px 0 13px}
.section-head h2{margin:0;flex:1;font-size:21px}
.back,.ghost,.primary,.danger{border:0;border-radius:12px;padding:10px 12px}
.back,.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.primary{background:var(--accent);color:var(--accentText)}
.danger{background:var(--bad);color:white}
.lesson{padding:16px}
.lesson-body{line-height:1.72;font-size:15px;overflow-wrap:anywhere}
.lesson-body hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.lesson-body code,.code{display:block;white-space:pre-wrap;overflow:auto;background:rgba(0,0,0,.24);padding:12px;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.46}
.command-list{display:grid;gap:8px;margin-top:10px}
.cmd-card{padding:13px;text-align:left;color:var(--text);width:100%}
.cmd-card code{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-card span{display:block;color:var(--hint);font-size:12px;margin-top:4px}
.command-detail{margin-top:12px;padding:14px;background:rgba(36,129,204,.07);border:1px solid var(--line);border-radius:15px}
.chips,.practice-tabs,.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px}
.chip,.subtab,.filter{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 12px;white-space:nowrap}
.chip.active,.subtab.active,.filter.active{background:var(--accent);color:var(--accentText)}
.bar{height:12px;background:rgba(148,163,184,.2);border-radius:999px;overflow:hidden;margin:11px 0}
.fill{height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{padding:13px}.stat b{display:block;font-size:21px}.stat span{display:block;color:var(--hint);font-size:11px}
.search,.textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}
.textarea{min-height:130px;resize:vertical}
.admin-head{display:flex;gap:8px;margin:10px 0}
.user-card{padding:14px}.user-id{font-size:11px;color:var(--hint);margin-top:2px}
.user-tab{margin:9px 0;padding:9px;border-radius:12px;background:rgba(148,163,184,.08);font-size:12px;overflow-wrap:anywhere}
.user-actions{display:flex;gap:7px;flex-wrap:wrap}
.detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.view-row{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.option{width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);margin-top:8px}
.option.correct{border:2px solid var(--good)} .option.wrong{border:2px solid var(--bad)} .option:disabled{opacity:.95}
.feedback{margin-top:12px;padding:12px;border-radius:14px;background:rgba(36,129,204,.08)}
.task-solution{margin-top:12px}
.training-module,.learn-block{padding:14px;margin-bottom:9px}
.training-module b{display:block;margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px;font-size:12px}
.ticket{padding:14px;margin-bottom:9px}
.ticket.open{border-left:4px solid var(--warn)}
.ticket.answered{border-left:4px solid var(--good)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-backdrop.show{display:flex}
.modal{width:min(680px,100%);background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px;box-shadow:0 -15px 40px rgba(0,0,0,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-actions{display:flex;gap:8px;margin-top:10px}.modal-actions>*{flex:1}
.empty,.spinner{text-align:center;padding:30px;color:var(--hint)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:50}
.tabs{max-width:980px;margin:auto;display:flex;overflow-x:auto;gap:4px}
.tab{border:0;background:transparent;color:var(--hint);min-width:64px;flex:1;padding:8px 5px;border-radius:12px;font-size:10px}
.tab.active{background:var(--card);color:var(--text)}
.tab b{display:block;font-size:17px}
.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;z-index:120;display:none;max-width:90%}
.toast.show{display:block}
@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.tab{min-width:70px}}

:root{--bg-light:#f5f7fb;--card-light:#ffffff;--text-light:#111827;--hint-light:#64748b;--line-light:rgba(15,23,42,.12)}
body.light{background:var(--bg-light);color:var(--text-light)}
body.light .top{background:linear-gradient(var(--bg-light) 85%,transparent)}
body.light .card,body.light .lesson,body.light .cmd-card,body.light .code-card,body.light .user-card,body.light .stat,body.light .support-card,body.light .ticket,body.light .learn-block,body.light .ghost,body.light .search,body.light .textarea,body.light .modal{background:var(--card-light);color:var(--text-light);border-color:var(--line-light)}
body.light .user,body.light .small,body.light .muted,body.light .card p{color:var(--hint-light)}
body.light .bottom{background:rgba(255,255,255,.94)}
.feature-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:7px 10px}
.search-wrap{display:flex;gap:8px;margin-bottom:10px}.search-wrap .search{flex:1}
.result-card{padding:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer}
.map-node{position:relative;padding:13px 13px 13px 22px;border-left:3px solid var(--accent);margin-left:8px}
.map-node:before{content:"";position:absolute;left:-8px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.goal-card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;color:var(--text);width:100%}
.goal-card.active{outline:2px solid var(--accent)}
.mentor-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.mentor-box{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.editor{min-height:220px;width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;background:rgba(0,0,0,.25);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;resize:vertical;outline:none}
body.light .editor{background:#f8fafc;color:#111827}
.project-stage{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.kpi{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.setting-row{padding:13px 0;border-bottom:1px solid var(--line)}
.setting-title{font-weight:800}.setting-desc{font-size:12px;color:var(--hint);margin:5px 0 8px}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">🐍 Python Academy <span class="badge" id="buildVersion">v13</span></div>
    <div class="feature-actions" style="margin:0">
      <button class="icon-btn" id="searchBtn" title="Поиск">🔎</button>
      <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
      <span class="user" id="userName">Telegram</span>
    </div>
  </div>
  <main id="content"><div class="spinner">Открываем приложение…</div></main>
</div>

<div class="bottom">
  <div class="tabs">
    <button class="tab" data-tab="learn"><b>🐍</b>Обучение</button>
    <button class="tab" data-tab="course"><b>📚</b>Курс</button>
    <button class="tab" data-tab="frameworks"><b>🧩</b>Фреймворки</button>
    <button class="tab" data-tab="libraries"><b>📦</b>Библиотеки</button>
    <button class="tab" data-tab="practice"><b>🧪</b>Практика</button>
    <button class="tab" data-tab="mentor"><b>🤖</b>Наставник</button>
    <button class="tab" data-tab="progress"><b>📊</b>Прогресс</button>
    <button class="tab" data-tab="support"><b>🆘</b>Поддержка</button>
    <button class="tab" data-tab="settings"><b>⚙️</b>Настройки</button>
    <button class="tab" data-tab="admin" id="adminTab" style="display:none"><b>🛠</b>Админ</button>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Сообщение</h3><button class="ghost" id="modalClose">✕</button></div>
    <textarea id="modalText" class="textarea" maxlength="4000" placeholder="Введите сообщение..."></textarea>
    <div class="modal-actions"><button class="ghost" id="modalCancel">Отмена</button><button class="primary" id="modalSend">Отправить</button></div>
    <div class="small" id="modalHint"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const state={
  course:{},frameworks:{},libraries:{},frameworkGroups:[],libraryGroups:[],
  miniCodes:{},learning:[],tasks:[],quizzes:[],total:0,isAdmin:false,quizScore:0,
  lastTab:'learn'
};
const $=id=>document.getElementById(id), content=$("content");
const h=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let modalAction=null, adminFilter="all", currentModalMeta="";

async function api(path,options={}){
  const c=new AbortController(), timer=setTimeout(()=>c.abort(),12000);
  try{
    const headers={"Content-Type":"application/json",...(options.headers||{})};
    if(tg?.initData) headers["X-Telegram-Init-Data"]=tg.initData;
    const r=await fetch(path,{...options,headers,signal:c.signal,cache:"no-store"});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      const msg=d.reason?`${d.error||`HTTP ${r.status}`} — ${d.reason}`:(d.error||`HTTP ${r.status}`);
      throw new Error(msg);
    }
    return d;
  }catch(e){
    if(e.name==="AbortError") throw new Error("Сервер не ответил за 12 секунд");
    throw e;
  }finally{clearTimeout(timer)}
}

function toast(msg){
  const el=$("toast");el.textContent=msg;el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2500);
}
function setActive(name){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===name))}
async function track(name){
  state.lastTab=String(name).slice(0,200);
  if(!tg?.initData) return;
  try{await api("/api/tab",{method:"POST",body:JSON.stringify({initData:tg.initData,tab:state.lastTab})})}catch{}
}
function screen(name){setActive(name.split(":")[0]);track(name)}
function header(title,back=true){
  return `<div class="section-head">${back?'<button class="back" id="backBtn">← Назад</button>':''}<h2>${h(title)}</h2></div>`;
}
async function copyText(x){try{await navigator.clipboard.writeText(x);toast("Код скопирован")}catch{toast("Не удалось скопировать код")}}
function escapeAttr(x){return h(x).replace(/`/g,"&#96;")}

// ---------- ОБУЧЕНИЕ ----------
const learnExtra={
  start:{
    why:"Python проще изучать, когда ты понимаешь модель выполнения: код идёт сверху вниз, выражения вычисляются, переменные хранят значения, функции группируют действия.",
    theory:[
      "Каждая строка должна быть понятна по трём вопросам: что создаётся, что изменяется и что выводится.",
      "Тип данных определяет доступные операции. Ошибка типов часто означает, что две части программы говорят на разных «языках».",
      "input() всегда возвращает строку, поэтому для числовых вычислений обычно нужен int() или float()."
    ],
    example:'name = input("Имя: ").strip()\nage = int(input("Возраст: "))\nnext_year = age + 1\nprint(f"{name}, через год тебе {next_year}")',
    mistakes:["Пытаться сложить строку и число без преобразования.","Путать значение переменной и текст с таким же написанием.","Копировать пример без эксперимента с входными данными."],
    practice:"Сделай программу «анкета»: имя, город, возраст. Выведи аккуратный профиль пользователя."
  },
  logic:{
    why:"Алгоритм начинается не с синтаксиса, а с условий и повторений. Если ты можешь описать решение словами, его проще записать в Python.",
    theory:[
      "if проверяет условие, elif добавляет ветвь, else покрывает оставшийся случай.",
      "for удобен, когда перебираешь коллекцию или известный диапазон; while — когда условие окончания важнее количества шагов.",
      "list хранит порядок, set — уникальность, dict — связь ключ→значение."
    ],
    example:'numbers = [4, 7, 10, 13]\nfor n in numbers:\n    if n % 2 == 0:\n        print(n, "чётное")\n    else:\n        print(n, "нечётное")',
    mistakes:["Бесконечный while без изменения условия.","Неправильный отступ внутри if или for.","Использование индекса там, где достаточно for element in collection."],
    practice:"Напиши меню из трёх команд: добавить число, показать числа, выйти."
  },
  strings:{
    why:"Строки встречаются в логинах, файлах, сообщениях, URL, JSON и командах. Владение строками резко упрощает реальные задачи.",
    theory:[
      "Строки неизменяемы: методы вроде replace() возвращают новую строку.",
      "split() превращает строку в список, join() собирает список строк обратно.",
      "Сначала очищай ввод strip(), затем нормализуй регистр lower(), потом проверяй содержание."
    ],
    example:'raw = "  Python,Flask,Django  "\nparts = [x.strip().lower() for x in raw.strip().split(",")]\nprint(parts)',
    mistakes:["Забыть, что upper()/lower()/replace() возвращают новую строку.","Ожидать, что split() изменит исходную строку.","Смешивать очистку данных и бизнес-логику в одну нечитаемую строку."],
    practice:"Сделай мини-парсер команды вида «/add Имя 14»: отдели команду от аргументов."
  },
  functions:{
    why:"Функции позволяют строить программу из маленьких частей. Это один из главных переходов от учебных скриптов к нормальным проектам.",
    theory:[
      "Параметр — имя, указанное в определении функции; аргумент — конкретное значение при вызове.",
      "return передаёт результат наружу. print() только показывает результат пользователю.",
      "Функция с одной понятной ответственностью легче тестируется и переиспользуется."
    ],
    example:'def calculate_total(price, count, discount=0):\n    subtotal = price * count\n    return subtotal * (1 - discount / 100)\n\nprint(calculate_total(100, 3, 10))',
    mistakes:["Функция меняет слишком много состояний.","Использование global там, где можно вернуть значение.","Слишком длинная функция без понятных этапов."],
    practice:"Раздели простой калькулятор на функции input_data(), calculate() и show_result()."
  },
  collections:{
    why:"Большинство прикладных программ работают с наборами данных. Выбор структуры часто важнее знания отдельного метода.",
    theory:[
      "list — последовательность с индексами; dict — быстрый доступ по ключу; set — уникальные элементы; tuple — неизменяемая последовательность.",
      "comprehension полезен для коротких преобразований и фильтрации, но читаемость важнее компактности.",
      "copy() создаёт новый список верхнего уровня; вложенные объекты внутри могут оставаться общими."
    ],
    example:'users = [{"name":"A","age":17},{"name":"B","age":22}]\nadults = [u["name"] for u in users if u["age"] >= 18]\nprint(adults)',
    mistakes:["Удаление элементов из списка во время его же перебора.","Неверное понимание разницы == и is.","Использование списка для задач, где нужен быстрый доступ по ключу."],
    practice:"Сделай мини-телефонную книгу на dict: добавить, найти, удалить, показать всех."
  },
  errors:{
    why:"Ошибки неизбежны. Профессиональный навык — быстро определить тип проблемы и локализовать её.",
    theory:[
      "SyntaxError — Python не может разобрать код; TypeError — операция не подходит типам; ValueError — тип подходящий, но значение некорректно.",
      "try/except обрабатывает ожидаемые ошибки на границе ввода и внешних ресурсов.",
      "with для файлов помогает корректно освобождать ресурс."
    ],
    example:'try:\n    age = int(input("Возраст: "))\nexcept ValueError:\n    print("Нужно ввести целое число")',
    mistakes:["Голый except, который скрывает настоящие ошибки.","Игнорирование текста traceback.","Открывать файл и забывать его закрыть."],
    practice:"Напиши CLI-заметки, которые сохраняются в JSON и переживают перезапуск программы."
  },
  modules:{
    why:"Когда проект становится больше одного файла, модули и виртуальные окружения становятся обязательной базовой гигиеной.",
    theory:[
      "import подключает модуль; from ... import — конкретное имя; as задаёт псевдоним.",
      "venv изолирует зависимости проекта от системного Python.",
      "requirements.txt фиксирует список зависимостей для воспроизводимой установки."
    ],
    example:'from pathlib import Path\n\nDATA = Path("data") / "users.json"\nprint(DATA.exists())',
    mistakes:["Устанавливать пакеты глобально для каждого проекта.","Смешивать зависимости разных проектов.","Называть свой файл так же, как стандартный модуль, например random.py."],
    practice:"Создай проект из main.py, helpers.py и config.py и установи одну внешнюю библиотеку в venv."
  },
  oop:{
    why:"ООП полезно, когда у сущности есть состояние и связанные с ним действия. Это инструмент организации кода, а не обязательный ритуал.",
    theory:[
      "class описывает структуру и поведение; экземпляр — конкретный объект.",
      "self указывает на текущий экземпляр; __init__ устанавливает начальное состояние.",

function catalogHome(type,category=null){
  screen(type==="framework"?"frameworks":"libraries");
  const groups=type==="framework"?state.frameworkGroups:state.libraryGroups;
  const data=type==="framework"?state.frameworks:state.libraries;
  const title=type==="framework"?"🧩 Фреймворки":"📦 Библиотеки";
  const allCount=Object.keys(data).length;
  let body="";
  if(category){
    const group=groups.find(x=>x.id===category);
    const shown=Object.entries(data).filter(([_,d])=>d.category===category);
    body=`<section class="hero"><span class="badge">${h(group?.title||category)}</span><h3 style="margin:10px 0">${h(group?.description||"")}</h3>
      <div class="grid">${shown.map(([k,d])=>`<div class="card clickable" data-item="${escapeAttr(k)}"><h3>${h(d.name)}</h3><p>${h(d.desc)}</p><span class="small">${(d.commands||[]).length} команд · открыть →</span></div>`).join("")||'<div class="empty">Пока пусто.</div>'}</div></section>`;
  }else{
    body=`<section class="hero"><h3>${title}</h3><p>Всего: <b>${allCount}</b>. Нажми направление — увидишь только относящиеся к нему технологии.</p>
      <div class="grid">${groups.map(g=>`<div class="card clickable" data-cat="${escapeAttr(g.id)}"><span class="badge">${g.items.length} шт.</span><h3 style="margin-top:8px">${h(g.title)}</h3><p>${h(g.description)}</p></div>`).join("")}</div></section>`;
  }
  const chips=groups.map(g=>`<button class="chip ${g.id===category?"active":""}" data-cat="${escapeAttr(g.id)}">${h(g.title)}</button>`).join("")+
    `<button class="chip ${!category?"active":""}" id="catAll">Все</button>`;
  content.innerHTML=header(title,false)+`<div class="chips">${chips}</div>${body}`;
  document.querySelectorAll("[data-cat]").forEach(x=>x.onclick=()=>catalogHome(type,x.dataset.cat));
  if($("catAll"))$("catAll").onclick=()=>catalogHome(type,null);
  document.querySelectorAll("[data-item]").forEach(x=>x.onclick=()=>openCatalogItem(type,x.dataset.item,category));
}
function openCatalogItem(type,key,category){
  const data=type==="framework"?state.frameworks[key]:state.libraries[key];if(!data)return;
  screen(`${type}:${key}`);
  const commands=data.commands||[];
  content.innerHTML=header(data.name)+`<article class="lesson">
    ${data.logo?`<img src="${h(data.logo)}" alt="" style="width:100%;max-height:190px;object-fit:contain;background:#fff;border-radius:14px;margin-bottom:10px">`:""}
    <p>${h(data.desc)}</p>
    <div class="chips"><span class="badge">${h(type==="framework"?"Фреймворк":"Библиотека")}</span><span class="badge">${commands.length} команд</span></div>
    <div class="command-list"><h3>🧭 Команды и методы</h3>
      ${commands.map((c,i)=>`<button class="cmd-card" data-command="${i}"><code>${h(c[0])}</code><span>${h(c[1])}</span></button>`).join("")||"<p class='small'>Команд пока нет.</p>"}
    </div>
    <div id="commandDetail"></div>
    ${data.url?`<p style="margin-top:14px"><a class="primary" style="display:inline-block;text-decoration:none" href="${h(data.url)}" target="_blank">🔗 Официальная документация</a></p>`:""}
  </article>`;
  $("backBtn").onclick=()=>catalogHome(type,category);
  document.querySelectorAll("[data-command]").forEach(x=>x.onclick=()=>{
    const c=commands[+x.dataset.command];
    $("commandDetail").innerHTML=`<div class="command-detail"><b>${h(c[0])}</b><p>${h(c[1])}</p><button class="ghost" id="copyCommand">📋 Скопировать</button><div class="small" style="margin-top:8px">Изучи синтаксис, затем попробуй изменить аргументы и проверить поведение.</div></div>`;
    $("copyCommand").onclick=()=>copyText(c[0]);
  });
}

async function answerQuiz(q,i,option){
  const buttons=[...document.querySelectorAll("[data-option]")];buttons.forEach(b=>b.disabled=true);
  let d;
  try{
    d=await api("/api/quiz",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",quiz_id:q.id,option_index:option})});
  }catch(e){
    // For a temporary network failure, don't fake server persistence.
    d={correct:option===q.correct,correct_option:q.correct,explanation:`Не удалось записать ответ на сервер: ${e.message}`};
  }
  buttons.forEach((b,j)=>{if(j===d.correct_option)b.classList.add("correct");if(j===option&&!d.correct)b.classList.add("wrong")});
  if(d.correct)state.quizScore++;
  $("quizFeedback").innerHTML=`<div class="feedback"><b>${d.correct?"✅ Правильно!":"❌ Неверно"}</b><br>${h(d.explanation)}<br><br><b>Счёт в сессии: ${state.quizScore}</b><br><br><button class="primary" id="nextQuiz">${i+1<state.quizzes.length?"Следующий вопрос →":"Завершить"}</button></div>`;
  $("nextQuiz").onclick=()=>i+1<state.quizzes.length?openQuiz(i+1):quizHome();
}

async function loadApp(){
  tg?.ready();tg?.expand();
  const u=tg?.initDataUnsafe?.user;
  if(u)$("userName").textContent=u.username?`@${u.username}`:(u.first_name||"Telegram");

  // Главное: UI открывается сразу после получения публичного payload.
  try{
    const d=await api("/api/course");
    state.course=d.course||{};state.frameworks=d.frameworks||{};state.libraries=d.libraries||{};
    state.frameworkGroups=d.framework_groups||[];state.libraryGroups=d.library_groups||[];
    state.miniCodes=d.mini_codes||{};state.learning=d.learning_plan||[];state.tasks=d.practice_tasks||[];
    state.quizzes=d.quizzes||[];state.total=d.total_topics||0;
    if(d.app_version)$("buildVersion").textContent="v"+d.app_version.replace(/^v/i,"");
    learningHome();
  }catch(e){
    content.innerHTML=`<div class="empty"><h3>Не удалось загрузить данные</h3><p>${h(e.message)}</p><button class="primary" onclick="loadApp()">Повторить</button></div>`;
    return;
  }

  // Авторизация в фоне. От неё не зависит отображение курса.
  if(tg?.initData){
    try{
      const me=await api("/api/me",{method:"POST",body:JSON.stringify({initData:tg.initData})});

      if(state.isAdmin)$("adminTab").style.display="block";

}

function v12Search(){

};
const V14_EN_TO_RU=Object.fromEntries(Object.entries(V14_UI).map(([ru,en])=>[en,ru]));
function v14TranslateExact(value){
  const lang=state.settings?.language||'ru';
  const map=lang==='en'?V14_UI:V14_EN_TO_RU;
  const trimmed=value.trim();
  if(!trimmed || trimmed.length>160) return value;
  if(Object.prototype.hasOwnProperty.call(map,trimmed)) return value.replace(trimmed,map[trimmed]);
  return value;
}
let v14Translating=false;
function v14ApplyLanguage(){
  if(v14Translating)return;
  v14Translating=true;
  try{
    const lang=state.settings?.language||'ru';
    document.documentElement.lang=lang;
    const labels={learn:['Обучение','Learning'],course:['Курс','Course'],frameworks:['Фреймворки','Frameworks'],libraries:['Библиотеки','Libraries'],practice:['Практика','Practice'],mentor:['Наставник','Mentor'],progress:['Прогресс','Progress'],support:['Поддержка','Support'],settings:['Настройки','Settings'],admin:['Админ','Admin']};
    document.querySelectorAll('.tab').forEach(btn=>{
      const pair=labels[btn.dataset.tab], node=btn.querySelector('b')?.nextSibling;
      if(pair&&node) node.nodeValue=' '+(lang==='en'?pair[1]:pair[0]);
    });
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      if(node.parentElement?.closest('script,style'))return;
      node.nodeValue=v14TranslateExact(node.nodeValue);
    });
    document.querySelectorAll('input,textarea').forEach(el=>{
      const p=el.placeholder||'';
      const translated=v14TranslateExact(p);
      if(translated!==p)el.placeholder=translated;
    });
    if($('searchBtn'))$('searchBtn').title=lang==='en'?'Search':'Поиск';
    if($('settingsBtn'))$('settingsBtn').title=lang==='en'?'Settings':'Настройки';
  }finally{v14Translating=false}
}

const v14Observer=new MutationObserver(()=>{
  if(!v14Translating) requestAnimationFrame(v14ApplyLanguage);
});
v14Observer.observe(document.body,{childList:true,subtree:true,characterData:true});
