<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Python Academy</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0f172a);--card:var(--tg-theme-secondary-bg-color,#172033);--text:var(--tg-theme-text-color,#f8fafc);--hint:var(--tg-theme-hint-color,#94a3b8);--accent:var(--tg-theme-button-color,#2481cc);--accentText:var(--tg-theme-button-text-color,#fff);--line:rgba(148,163,184,.16)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:94px}.app{max-width:820px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{font-weight:900;font-size:20px}.user{color:var(--hint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero,.card,.topic,.lesson,.cmd-card,.code-card,.user-card,.stat{background:var(--card);border:1px solid var(--line);border-radius:18px}.hero{padding:18px;margin-bottom:14px}.hero h1{margin:0 0 8px}.hero p,.card p,.topic span,.small{color:var(--hint)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:15px;min-height:104px}.card h3{margin:0 0 8px;font-size:16px}.topic{padding:13px;display:flex;justify-content:space-between;gap:10px}.topic strong{font-size:14px}.section-head{display:flex;align-items:center;gap:9px;margin:8px 0 13px}.section-head h2{margin:0;flex:1;font-size:21px}.back,.ghost,.primary{border:0;border-radius:12px;padding:10px 12px}.back,.ghost{background:var(--card);color:var(--text)}.primary{background:var(--accent);color:var(--accentText)}.lesson{padding:16px}.lesson img{width:100%;max-height:220px;object-fit:contain;background:#fff;border-radius:14px;margin-bottom:12px}.lesson-body{line-height:1.65;font-size:15px;overflow-wrap:anywhere}.lesson-body code,.code{display:block;white-space:pre-wrap;overflow:auto;background:rgba(0,0,0,.22);padding:12px;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.45}.action{display:inline-block;margin-top:12px;padding:10px 13px;border-radius:12px;background:var(--accent);color:var(--accentText);text-decoration:none}.command-list{display:grid;gap:8px;margin-top:10px}.cmd-card{padding:13px;text-align:left;color:var(--text);width:100%}.cmd-card code{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cmd-card span{color:var(--hint);font-size:12px}.command-detail{margin-top:12px;padding:14px;background:rgba(36,129,204,.07);border:1px solid var(--line);border-radius:15px}.code-card{padding:15px}.code-card .code{max-height:380px}.badge{display:inline-block;background:rgba(36,129,204,.15);color:var(--accent);padding:5px 8px;border-radius:999px;font-size:11px}.bar{height:12px;background:rgba(148,163,184,.2);border-radius:999px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--accent)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px}.stat b{display:block;font-size:22px}.admin-head{display:flex;gap:8px;margin:10px 0}.search{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;outline:none}.users{display:grid;gap:9px}.user-card{padding:14px}.user-top{display:flex;justify-content:space-between;gap:8px}.user-id{font-size:11px;color:var(--hint)}.user-tab{margin:9px 0;padding:9px;border-radius:12px;background:rgba(148,163,184,.08);font-size:12px;overflow-wrap:anywhere}.user-actions{display:flex;gap:7px;flex-wrap:wrap}.detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.view-row{padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}.empty,.spinner{text-align:center;padding:30px;color:var(--hint)}.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20}.tabs{max-width:820px;margin:auto;display:flex;overflow-x:auto;gap:5px}.tab{border:0;background:transparent;color:var(--hint);min-width:70px;flex:1;padding:8px 7px;border-radius:12px;font-size:10px}.tab.active{background:var(--card);color:var(--text)}.tab b{display:block;font-size:17px}@media(max-width:560px){.grid{grid-template-columns:1fr}.tab{min-width:64px}}
</style>
</head>
<body>
<div class="app"><div class="top"><div class="brand">🐍 Python Academy</div><div class="user" id="userName">Telegram</div></div><main id="content"><div class="spinner">Загрузка…</div></main></div>
<div class="bottom"><div class="tabs"><button class="tab" data-tab="course"><b>📚</b>Курс</button><button class="tab" data-tab="frameworks"><b>🧩</b>Фреймворки</button><button class="tab" data-tab="libraries"><b>📦</b>Библиотеки</button><button class="tab" data-tab="mini"><b>🧪</b>Мини-коды</button><button class="tab" data-tab="progress"><b>📊</b>Прогресс</button><button class="tab" data-tab="admin" id="adminTab" style="display:none"><b>🛠</b>Админ</button></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const state={course:{},frameworks:{},libraries:{},miniCodes:{},total:0,isAdmin:false};
const $=id=>document.getElementById(id),content=$("content");let adminTimer=null;
async function api(path,options={}){const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);try{const headers={"Content-Type":"application/json",...(options.headers||{})};if(tg?.initData)headers["X-Telegram-Init-Data"]=tg.initData;const r=await fetch(path,{...options,headers,signal:c.signal});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.reason?`${d.error||`HTTP ${r.status}`}:`HTTP ${r.status}`} ${d.reason}`.trim());return d}catch(e){if(e.name==="AbortError")throw new Error("Сервер не ответил за 12 секунд");throw e}finally{clearTimeout(timer)}}
const h=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setActive(n){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===n))}async function track(n){if(!tg?.initData)return;try{await api('/api/tab',{method:'POST',body:JSON.stringify({initData:tg.initData,tab:String(n).slice(0,200)})})}catch(e){}}
function screen(n){setActive(n);track(n)}function header(t,back=true){return `<div class="section-head">${back?'<button class="back" id="backBtn">← Назад</button>':''}<h2>${t}</h2></div>`}async function copyText(x){try{await navigator.clipboard.writeText(x);alert('Скопировано')}catch{alert('Не удалось скопировать')}}
function courseHome(){screen('course');const a=Object.entries(state.course);content.innerHTML=`<section class="hero"><h1>📚 Курс Python</h1><p>${a.length} разделов · ${state.total} тем</p></section><div class="grid">${a.map(([n,s])=>`<div class="card" data-section="${n}"><h3>${h(s.title)}</h3><p>${s.topics.length} тем</p></div>`).join('')}</div>`;document.querySelectorAll('[data-section]').forEach(x=>x.onclick=()=>openSection(+x.dataset.section))}
function openSection(n){const s=state.course[n];if(!s)return;screen(`section:${n}`);content.innerHTML=header(h(s.title))+`<div class="grid">${s.topics.map((t,i)=>`<div class="topic" data-topic="${i}"><strong>📖 ${i+1}. ${h(t)}</strong><span>Открыть</span></div>`).join('')}</div>`;$('backBtn').onclick=courseHome;document.querySelectorAll('[data-topic]').forEach(x=>x.onclick=()=>openLesson(n,+x.dataset.topic))}
async function openLesson(n,i){const t=state.course[n]?.topics?.[i];if(!t)return;screen(`lesson:${n}:${i}`);content.innerHTML=`<div class="spinner">Загрузка «${h(t)}»…</div>`;try{const d=await api(`/api/lesson/${n}/${i}`);content.innerHTML=header(`📖 ${h(d.topic)}`)+`<article class="lesson"><div class="lesson-body">${d.html}</div></article>`;$('backBtn').onclick=()=>openSection(n)}catch(e){content.innerHTML=`<div class="empty">Ошибка: ${h(e.message)}</div>`}}
function itemsHome(type){screen(type==='framework'?'frameworks':'libraries');const s=type==='framework'?state.frameworks:state.libraries;content.innerHTML=header(type==='framework'?'🧩 Фреймворки':'📦 Библиотеки',false)+`<div class="hero"><p>Выбирай элемент. Внутри нажимай на любую команду — увидишь, что она делает.</p></div><div class="grid">${Object.entries(s).map(([k,d])=>`<div class="card" data-item="${h(k)}"><h3>${h(d.name)}</h3><p>${(d.commands||[]).length} команд</p></div>`).join('')}</div>`;document.querySelectorAll('[data-item]').forEach(x=>x.onclick=()=>openItem(type,x.dataset.item))}
function frameworksHome(){itemsHome('framework')}function librariesHome(){itemsHome('library')}
function openItem(type,key){const s=type==='framework'?state.frameworks:state.libraries,d=s[key];if(!d)return;screen(`${type}:${key}`);content.innerHTML=header(h(d.name))+`<article class="lesson">${d.logo?`<img src="${h(d.logo)}" alt="${h(d.name)}">`:''}<div class="lesson-body">${d.desc}</div>${d.url?`<a class="action" href="${h(d.url)}" target="_blank" rel="noopener">🔗 Официальный сайт</a>`:''}<h3>🧭 Команды</h3><div class="command-list">${(d.commands||[]).map((c,i)=>`<button class="cmd-card" data-cmd="${i}"><code>${h(c[0])}</code><span>${h(c[1])}</span></button>`).join('')}</div><div id="commandDetail"></div></article>`;$('backBtn').onclick=type==='framework'?frameworksHome:librariesHome;document.querySelectorAll('[data-cmd]').forEach(x=>x.onclick=()=>showCommand(type,key,+x.dataset.cmd))}
function showCommand(type,key,i){const d=(type==='framework'?state.frameworks:state.libraries)[key],c=d?.commands?.[i];if(!c)return;screen(`${type}:${key}:command:${i}`);$('commandDetail').innerHTML=`<div class="command-detail"><h3>Что делает</h3><div class="small">${h(c[1])}</div><pre class="code">${h(c[0])}</pre><button class="primary" id="copyCmd">📋 Скопировать</button></div>`;$('copyCmd').onclick=()=>copyText(c[0])}
function miniHome(){screen('mini');const a=Object.entries(state.miniCodes);content.innerHTML=header('🧪 Мини-коды',false)+`<div class="hero"><p>Готовые маленькие программы: калькулятор, игры и рисунки turtle.</p></div><div class="grid">${a.map(([k,d])=>`<div class="card" data-mini="${h(k)}"><span class="badge">${h(d.category)}</span><h3 style="margin:8px 0">${h(d.title)}</h3><p>${h(d.description)}</p></div>`).join('')}</div>`;document.querySelectorAll('[data-mini]').forEach(x=>x.onclick=()=>openMini(x.dataset.mini))}
function openMini(k){const d=state.miniCodes[k];if(!d)return;screen(`mini:${k}`);content.innerHTML=header(h(d.title))+`<article class="code-card"><span class="badge">${h(d.category)}</span><h3>${h(d.title)}</h3><p class="small">${h(d.description)}</p><pre class="code">${h(d.code)}</pre><button class="primary" id="copyCode">📋 Скопировать код</button><p><b>Результат:</b> ${h(d.result)}</p></article>`;$('backBtn').onclick=miniHome;$('copyCode').onclick=()=>copyText(d.code)}
async function progressHome(){screen('progress');content.innerHTML='<div class="spinner">Считаем прогресс…</div>';try{const d=await api('/api/progress',{method:'POST',body:JSON.stringify({initData:tg?.initData||''})}),p=d.total?Math.round(d.done/d.total*100):0;content.innerHTML=header('📊 Мой прогресс',false)+`<section class="hero"><b>Пройдено ${d.done} из ${d.total}</b><div class="bar"><div class="fill" style="width:${p}%"></div></div><span class="small">${p}%</span></section>`}catch(e){content.innerHTML=`<div class="empty">${h(e.message)}</div>`}}
async function loadAdmin(){if(!state.isAdmin)return;const q=$("adminSearch")?.value||'';try{const d=await api('/api/admin',{method:'POST',body:JSON.stringify({initData:tg?.initData||'',action:'users',query:q})});$("adminTotalUsers").textContent=d.total_users;$("adminTotalViews").textContent=d.total_views;$("adminUsers").innerHTML=d.users.map(u=>`<div class="user-card"><div class="user-top"><div><b>${h(u.first_name||'Без имени')}</b> ${u.username?`<span class="small">@${h(u.username)}</span>`:''}<div class="user-id">ID ${h(u.user_id)} · ${h(u.views_count)} действий</div></div></div><div class="user-tab"><b>Сейчас:</b> ${h(u.current_tab||'—')}<br><span class="small">${h(u.current_tab_at||u.last_seen||'')}</span></div><div class="user-actions"><button class="ghost" data-detail="${h(u.user_id)}">👁 История</button><button class="primary" data-send="${h(u.user_id)}">✉️ Написать</button></div><div id="detail-${h(u.user_id)}"></div></div>`).join('')||'<div class="empty">Нет пользователей</div>';document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>adminDetail(+x.dataset.detail));document.querySelectorAll('[data-send]').forEach(x=>x.onclick=()=>adminSend(+x.dataset.send))}catch(e){$("adminUsers").innerHTML=`<div class="empty">${h(e.message)}</div>`}}
async function adminDetail(id){const b=$(`detail-${id}`);b.innerHTML='<div class="detail">Загрузка…</div>';try{const d=await api('/api/admin',{method:'POST',body:JSON.stringify({initData:tg?.initData||'',action:'user',user_id:id})});b.innerHTML=`<div class="detail"><b>Последние действия</b>${d.views.map(v=>`<div class="view-row">${h(v.viewed_at)} · ${h(v.kind)} · ${h(v.title)}</div>`).join('')||'<div class="small">Нет действий</div>'}</div>`}catch(e){b.innerHTML=`<div class="detail">${h(e.message)}</div>`}}
async function adminSend(id){const text=prompt(`Сообщение пользователю ${id}:`);if(!text)return;try{await api('/api/admin',{method:'POST',body:JSON.stringify({initData:tg?.initData||'',action:'send',user_id:id,text})});alert('Сообщение отправлено')}catch(e){alert(e.message)}}
function adminHome(){screen('admin');clearInterval(adminTimer);content.innerHTML=header('🛠 Админ-панель',false)+`<div class="stats"><div class="stat"><b id="adminTotalUsers">—</b><span class="small">Пользователей</span></div><div class="stat"><b id="adminTotalViews">—</b><span class="small">Действий</span></div></div><div class="admin-head"><input id="adminSearch" class="search" placeholder="Поиск по ID, имени, username"><button class="primary" id="adminRefresh">↻</button></div><div id="adminUsers" class="users"><div class="spinner">Загрузка…</div></div>`;$('adminRefresh').onclick=loadAdmin;$('adminSearch').oninput=loadAdmin;loadAdmin();adminTimer=setInterval(loadAdmin,10000)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const t=b.dataset.tab;if(t==='course')courseHome();else if(t==='frameworks')frameworksHome();else if(t==='libraries')librariesHome();else if(t==='mini')miniHome();else if(t==='progress')progressHome();else if(t==='admin'&&state.isAdmin)adminHome()});
(async()=>{const u=tg?.initDataUnsafe?.user;if(u)$("userName").textContent=u.username?`@${u.username}`:(u.first_name||'Telegram');try{const me=await api('/api/me',{method:'POST',body:JSON.stringify({initData:tg?.initData||''})});state.isAdmin=!!me.is_admin;if(state.isAdmin)$("adminTab").style.display='block';const d=await api('/api/course');state.course=d.course;state.frameworks=d.frameworks;state.libraries=d.libraries;state.miniCodes=d.mini_codes||{};state.total=d.total_topics||0;courseHome()}catch(e){content.innerHTML=`<div class="empty">Не удалось запустить Mini App.<br>${h(e.message)}</div>`}})();
</script>
</body></html>
