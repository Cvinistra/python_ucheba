<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Python Academy</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{--bg:#0b1220;--card:#111b2d;--soft:#17233a;--text:#f8fafc;--muted:#94a3b8;--line:rgba(148,163,184,.16);--accent:var(--tg-theme-button-color,#2481cc);--good:#22c55e;--bad:#ef4444;--warn:#f59e0b}
body.light{--bg:#f5f7fb;--card:#fff;--soft:#eef2f7;--text:#111827;--muted:#64748b;--line:rgba(15,23,42,.12)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:96px}.app{max-width:1100px;margin:auto;padding:12px}
header{position:sticky;top:0;z-index:30;padding:7px 0 13px;background:linear-gradient(var(--bg) 82%,transparent)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:900}.header-actions{display:flex;gap:7px;align-items:center}.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:8px 10px}.userline{font-size:12px;color:var(--muted);margin-top:5px}
.hero,.card,.lesson,.panel,.ticket,.usercard,.stat,.result,.tech-card{background:var(--card);border:1px solid var(--line);border-radius:18px}.hero{padding:16px;margin-bottom:11px}.card,.tech-card{padding:14px;cursor:pointer}.card h3,.tech-card h3{margin:5px 0}.card p,.tech-card p{color:var(--muted);margin:5px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:12px}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(36,129,204,.14);color:var(--accent);font-size:11px}
.section{display:flex;align-items:center;gap:8px;margin:7px 0 13px}.section h2{margin:0;flex:1;font-size:21px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 12px}.btn.primary{border:0;background:var(--accent);color:#fff}.btn.good{border:0;background:var(--good);color:#07130b}.btn.danger{border:0;background:var(--bad);color:#fff}.wide{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 12px}.chip.active{background:var(--accent);color:#fff}
.bar{height:11px;border-radius:999px;background:rgba(148,163,184,.18);overflow:hidden}.fill{height:100%;background:var(--accent)}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.kpi{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.map{border-left:3px solid var(--accent);padding:11px 12px 11px 17px;margin-left:8px;position:relative}.map:before{content:"";position:absolute;left:-8px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.lesson{padding:16px;line-height:1.68}.lesson hr{border:0;border-top:1px solid var(--line);margin:22px 0}.lesson pre,.code{white-space:pre-wrap;overflow:auto;background:rgba(0,0,0,.2);padding:12px;border-radius:12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.panel{padding:13px}.input,.textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}.textarea{min-height:125px;resize:vertical}.result{padding:12px;margin-top:8px;cursor:pointer}.option{width:100%;text-align:left;padding:13px;margin-top:8px;border-radius:14px;background:var(--card);color:var(--text);border:1px solid var(--line)}.option.correct{border:2px solid var(--good)}.option.wrong{border:2px solid var(--bad)}.option:disabled{opacity:.98}.editor{width:100%;min-height:260px;background:#0a0f19;color:#e5e7eb;border:1px solid var(--line);border-radius:14px;padding:13px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.light .editor{background:#f8fafc;color:#111827}
.goal{padding:13px;text-align:left;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--text)}.goal.active{outline:2px solid var(--accent)}.project{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.project b:first-child{min-width:22px}.tech-relations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cat-card{min-height:126px}.admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.support-open{border-left:4px solid var(--warn)}.support-answered{border-left:4px solid var(--good)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}.tabs{max-width:1100px;margin:auto;display:flex;overflow:auto;gap:3px}.tab{min-width:72px;flex:1;border:0;background:transparent;color:var(--muted);padding:7px 4px;border-radius:12px;font-size:10px}.tab b{display:block;font-size:17px}.tab.active{background:var(--card);color:var(--text)}
.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px 13px;border-radius:12px;display:none;z-index:100;max-width:90%}.toast.show{display:block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:80}.modal.show{display:flex}.modalbox{width:min(720px,100%);background:var(--bg);border-radius:22px 22px 0 0;padding:16px}.modalhead{display:flex;justify-content:space-between;align-items:center}.spinner{text-align:center;color:var(--muted);padding:28px}
@media(max-width:700px){.grid,.tech-relations{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.tab{min-width:80px}}
</style>
</head>
<body>
<div class="app">
<header><div class="toprow"><div class="brand">🐍 Python Academy <span class="badge" id="ver">v15</span></div><div class="header-actions"><button class="icon-btn" id="searchBtn">🔎</button><button class="icon-btn" id="settingsBtn">⚙️</button></div></div><div class="userline" id="userLine">Telegram</div></header>
<main id="content"><div class="spinner">Загрузка…</div></main>
</div>
<div class="bottom"><div class="tabs">
<button class="tab" data-view="home"><b>🏠</b><span data-i18n="home">Главная</span></button>
<button class="tab" data-view="learn"><b>🐍</b><span data-i18n="learn">Обучение</span></button>
<button class="tab" data-view="catalog"><b>🧩</b><span data-i18n="catalog">Технологии</span></button>
<button class="tab" data-view="practice"><b>🧪</b><span data-i18n="practice">Практика</span></button>
<button class="tab" data-view="mentor"><b>🤖</b><span data-i18n="mentor">Наставник</span></button>
<button class="tab" data-view="progress"><b>📊</b><span data-i18n="progress">Прогресс</span></button>
<button class="tab" data-view="support"><b>🆘</b><span data-i18n="support">Поддержка</span></button>
<button class="tab" id="adminTab" data-view="admin" style="display:none"><b>🛠</b><span data-i18n="admin">Админ</span></button>
</div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">Сообщение</h3><button class="icon-btn" id="modalClose">✕</button></div><textarea id="modalText" class="textarea" placeholder="Введите сообщение"></textarea><div class="row" style="margin-top:9px"><button class="btn" id="modalCancel">Отмена</button><button class="btn primary" id="modalSend">Отправить</button></div></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=id=>document.getElementById(id);const content=$("content");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={course:{},frameworks:{},libraries:{},frameworkGroups:[],libraryGroups:[],miniCodes:{},learning:[],tasks:[],quizzes:[],total:0,user:null,isAdmin:false,settings:{language:"ru",theme:"system",goal:"general",notifications_enabled:true,reminder_time:"19:00",resume_enabled:true},favorites:[],last:null,trainer:[]};
const I={ru:{home:"Главная",learn:"Обучение",catalog:"Технологии",practice:"Практика",mentor:"Наставник",progress:"Прогресс",support:"Поддержка",admin:"Админ",settings:"Настройки",search:"Поиск",language:"Язык",theme:"Тема",system:"Системная",dark:"Тёмная",light:"Светлая",notifications:"Напоминания",resume:"Продолжать с места остановки",goal:"Цель обучения",favorite:"Избранное",send:"Отправить",all:"Все",active:"Активные",continue:"Продолжить",saved:"Сохранено"},en:{home:"Home",learn:"Learning",catalog:"Technologies",practice:"Practice",mentor:"Mentor",progress:"Progress",support:"Support",admin:"Admin",settings:"Settings",search:"Search",language:"Language",theme:"Theme",system:"System",dark:"Dark",light:"Light",notifications:"Reminders",resume:"Resume from last place",goal:"Learning goal",favorite:"Favorites",send:"Send",all:"All",active:"Active",continue:"Continue",saved:"Saved"}};
function T(k){return (I[state.settings.language]||I.ru)[k]||k}function toast(m){const x=$("toast");x.textContent=m;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
async function api(path,opt={}){const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);try{const headers={"Content-Type":"application/json",...(opt.headers||{})};if(tg?.initData)headers["X-Telegram-Init-Data"]=tg.initData;const r=await fetch(path,{...opt,headers,signal:c.signal,cache:"no-store"});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.reason?`${d.error}: ${d.reason}`:(d.error||`HTTP ${r.status}`));return d}catch(e){if(e.name==="AbortError")throw new Error("Сервер не ответил");throw e}finally{clearTimeout(t)}}
function screen(name){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===name.split(":")[0]));track(name)}
async function track(name){if(!tg?.initData)return;try{await api("/api/tab",{method:"POST",body:JSON.stringify({initData:tg.initData,tab:String(name).slice(0,200)})})}catch{}}
function bar(title,back){return `<div class="section">${back?`<button class="btn" id="backBtn">←</button>`:""}<h2>${esc(title)}</h2></div>`}
function copy(x){navigator.clipboard?.writeText(x).then(()=>toast("Скопировано")).catch(()=>toast("Не удалось скопировать"))}
function theme(){const x=state.settings.theme;if(x==="system")document.body.classList.toggle("light",!!window.matchMedia?.("(prefers-color-scheme:light)")?.matches);else document.body.classList.toggle("light",x==="light")}
function loadLocal(){try{Object.assign(state.settings,JSON.parse(localStorage.getItem("pyacademy_settings")||"{}"))}catch{}try{state.favorites=JSON.parse(localStorage.getItem("pyacademy_favorites")||"[]")}catch{}theme()}
async function saveSettings(){localStorage.setItem("pyacademy_settings",JSON.stringify(state.settings));theme();try{await api("/api/settings",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",...state.settings})})}catch(e){toast(e.message)}applyLang()}
function applyLang(){document.querySelectorAll("[data-i18n]").forEach(x=>x.textContent=T(x.dataset.i18n))}

async function home(){screen("home");content.innerHTML='<div class="spinner">Загрузка…</div>';try{const d=await api("/api/home",{method:"POST",body:JSON.stringify({initData:tg?.initData||""})});state.user=d.user;state.last=d.stats.last;$("userLine").textContent=state.user?.username?`@${state.user.username}`:(state.user?.first_name||"Telegram");const s=d.stats,p=s.quiz_total?Math.round(s.quiz_correct/s.quiz_total*100):0;const last=state.settings.resume_enabled&&s.last?`<div class="panel" style="margin:10px 0"><b>▶️ Последнее действие</b><p>${esc(s.last.title)}</p></div>`:"";content.innerHTML=bar(state.user?.first_name?`🏠 Привет, ${state.user.first_name}!`:"🏠 Python Academy")+`<section class="hero"><h2>🐍 Python Academy</h2><p>Учёба, практика, технологии, проекты и помощь — в одном Mini App.</p><div class="stats"><div class="stat"><b>${s.done}/${state.total}</b><span>уроков</span></div><div class="stat"><b>${s.tasks_done}</b><span>задач</span></div><div class="stat"><b>${p}%</b><span>точность викторины</span></div><div class="stat"><b>${s.favorites}</b><span>избранное</span></div></div><div class="bar" style="margin:12px 0"><div class="fill" style="width:${state.total?Math.round(s.done/state.total*100):0}%"></div></div>${last}<button class="btn primary wide" id="continueBtn">▶️ ${T("continue")}</button></section><div class="grid"><div class="card" id="goLearn"><h3>🗺 ${T("learn")}</h3><p>Персональный путь от нуля до профи.</p></div><div class="card" id="goPractice"><h3>🧪 ${T("practice")}</h3><p>Задания, викторины, тренажёр и проекты.</p></div><div class="card" id="goTech"><h3>🧩 ${T("catalog")}</h3><p>Фреймворки, библиотеки и связи.</p></div><div class="card" id="goMentor"><h3>🤖 ${T("mentor")}</h3><p>Объяснения и поиск материалов.</p></div><div class="card" id="goSupport"><h3>🆘 ${T("support")}</h3><p>Сообщение администраторам и история обращений.</p></div><div class="card" id="goSettings"><h3>⚙️ ${T("settings")}</h3><p>Язык, тема, уведомления и цель.</p></div></div>`;$("goLearn").onclick=learning;$("goPractice").onclick=()=>practice("tasks");$("goTech").onclick=()=>catalog("framework");$("goMentor").onclick=mentor;$("goSupport").onclick=support;$("goSettings").onclick=settings;$("continueBtn").onclick=resumeLast}catch(e){content.innerHTML=`<div class="empty">${esc(e.message)}<br><button class="btn primary" onclick="home()">Повторить</button></div>`}}
async function resumeLast(){if(!state.last){learning();return}if(state.last.kind==="topic"){const raw=String(state.last.title);const parts=raw.split(":");if(parts.length>=2&&!isNaN(+parts[0])){const sec=+parts[0];const topic=parts.slice(1).join(":");const idx=state.course[sec]?.topics?.indexOf(topic);if(idx>=0){openLesson(sec,idx);return}}}learning()}

function learning(){screen("learn");const priority={web:["webdb","advanced","projects"],telegram:["telegram","async","webdb","projects"],data:["collections","errors","projects"],games:["logic","functions","projects"],automation:["strings","modules","errors","projects"],general:[]}[state.settings.goal]||[];const arr=priority.length?[...state.learning].sort((a,b)=>(priority.includes(a.id)?0:1)-(priority.includes(b.id)?0:1)):state.learning;content.innerHTML=bar("🐍 "+T("learn"))+`<section class="hero"><h3>🎯 ${T("goal")}</h3><div class="grid">${[["general","🐍","Python"],["web","🌐","Web"],["telegram","🤖","Telegram"],["data","📊","Data"],["games","🎮","Игры"],["automation","⚙️","Автоматизация"]].map(x=>`<button class="goal ${state.settings.goal===x[0]?"active":""}" data-goal="${x[0]}"><b>${x[1]} ${esc(x[2])}</b></button>`).join("")}</div></section><section class="hero"><h3>🗺 Карта обучения</h3>${arr.map((s,i)=>`<div class="map"><b>${i+1}. ${esc(s.title)}</b><div class="small">${esc(s.description)}</div></div>`).join("")}</section><div class="grid">${arr.map((s,i)=>`<div class="card" data-stage="${i}"><span class="badge">${esc(s.level)}</span><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p><span class="small">${s.modules.length} модуля</span></div>`).join("")}</div>`;document.querySelectorAll("[data-goal]").forEach(b=>b.onclick=async()=>{state.settings.goal=b.dataset.goal;await saveSettings();learning()});document.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>learnStage(arr[+b.dataset.stage]))}
function learnStage(s){screen("learn:"+s.id);content.innerHTML=bar(s.title,learning)+`<article class="lesson"><h3>🎯 Что освоишь</h3><p>${esc(s.description)}</p>${s.modules.map(m=>`<div class="panel" style="margin:9px 0"><b>${esc(m.title)}</b><div class="small" style="margin-top:6px">${m.topics.map(t=>`• ${esc(t)}`).join("<br>")}</div></div>`).join("")}<h3>💡 Советы</h3><ul>${(s.tips||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="panel"><b>✅ Контрольная точка</b><p>${esc(s.checkpoint||"")}</p></div><button class="btn primary wide" id="stagePractice">🧪 Практика</button></article>`;$("stagePractice").onclick=()=>practice("tasks")}

function catalog(type="framework",category=null){screen("catalog");const groups=type==="framework"?state.frameworkGroups:state.libraryGroups;const data=type==="framework"?state.frameworks:state.libraries;const typeTitle=type==="framework"?"🧩 Фреймворки":"📦 Библиотеки";content.innerHTML=bar("🧩 Технологии")+`<section class="hero"><div class="chips"><button class="chip ${type==="framework"?"active":""}" id="frameworkBtn">🧩 Фреймворки</button><button class="chip ${type==="library"?"active":""}" id="libraryBtn">📦 Библиотеки</button></div><h3>${typeTitle}</h3><p class="small">Сначала направление → затем конкретная технология → затем команды и связанные инструменты.</p><div class="chips"><button class="chip ${!category?"active":""}" id="allCats">${T("all")}</button>${groups.map(g=>`<button class="chip ${category===g.id?"active":""}" data-cat="${esc(g.id)}">${esc(g.title)}</button>`).join("")}</div></section>${category?`<section class="hero"><h3>${esc(groups.find(g=>g.id===category)?.title||"")}</h3><div class="grid">${Object.entries(data).filter(([_,d])=>d.category===category).map(([k,d])=>`<div class="tech-card" data-tech="${esc(k)}"><span class="badge">${(d.commands||[]).length} команд</span><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p></div>`).join("")||'<div class="empty">Пока пусто.</div>'}</div></section>`:`<section class="hero"><div class="grid">${groups.map(g=>`<div class="card cat-card" data-cat="${esc(g.id)}"><h3>${esc(g.title)}</h3><p>${esc(g.description)}</p><span class="small">${g.items.length} технологий</span></div>`).join("")}</div></section>`}`;$("frameworkBtn").onclick=()=>catalog("framework");$("libraryBtn").onclick=()=>catalog("library");$("allCats").onclick=()=>catalog(type);document.querySelectorAll("[data-cat]").forEach(x=>x.onclick=()=>catalog(type,x.dataset.cat));document.querySelectorAll("[data-tech]").forEach(x=>x.onclick=()=>openTech(type,x.dataset.tech,category))}
function openTech(type,key,category){const d=type==="framework"?state.frameworks[key]:state.libraries[key];if(!d)return;screen(`${type}:${key}`);const data=type==="framework"?state.frameworks:state.libraries;const related=Object.entries(data).filter(([k,x])=>k!==key&&x.category===d.category).slice(0,8);const fav=state.favorites.includes(`${type}:${key}`);content.innerHTML=bar(d.name,()=>catalog(type,category))+`<article class="lesson">${d.logo?`<img src="${esc(d.logo)}" style="display:block;max-width:100%;max-height:160px;margin:0 auto 10px;background:#fff;border-radius:14px">`:""}<p>${esc(d.desc)}</p><div class="row"><button class="btn" id="fav">${fav?"★":"☆"} ${T("favorite")}</button>${d.url?`<a class="btn primary" href="${esc(d.url)}" target="_blank">📚 Docs</a>`:""}</div><h3>🧭 Команды</h3>${(d.commands||[]).map((c,i)=>`<div class="panel" style="margin-top:8px"><b>${esc(c[0])}</b><p>${esc(c[1])}</p><button class="btn" data-copy="${i}">📋 Скопировать</button></div>`).join("")||'<p>Команды пока не добавлены.</p>'}<h3>🔗 Связанные технологии</h3><div class="tech-relations">${related.map(([k,x])=>`<div class="tech-card" data-related="${esc(k)}"><b>${esc(x.name)}</b><p>${esc(x.desc)}</p></div>`).join("")||'<div class="small">Связанных элементов пока нет.</div>'}</div></article>`;$("backBtn").onclick=()=>catalog(type,category);$("fav").onclick=async()=>{const id=`${type}:${key}`,has=state.favorites.includes(id);if(has)state.favorites=state.favorites.filter(x=>x!==id);else state.favorites.push(id);localStorage.setItem("pyacademy_favorites",JSON.stringify(state.favorites));try{await api("/api/favorites",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:has?"remove":"add",kind:type,item_key:key})})}catch{};openTech(type,key,category)};document.querySelectorAll("[data-copy]").forEach(x=>x.onclick=()=>copy(d.commands[+x.dataset.copy][0]));document.querySelectorAll("[data-related]").forEach(x=>x.onclick=()=>openTech(type,x.dataset.related,category))}
function course(){screen("course");const a=Object.entries(state.course);content.innerHTML=bar("📚 Курс Python",learning)+`<div class="grid">${a.map(([n,s])=>`<div class="card" data-section="${n}"><h3>${esc(s.title)}</h3><p>${s.topics.length} тем</p></div>`).join("")}</div>`;document.querySelectorAll("[data-section]").forEach(x=>x.onclick=()=>openSection(+x.dataset.section))}
function openSection(n){const s=state.course[n];content.innerHTML=bar(s.title,course)+`<div class="grid">${s.topics.map((t,i)=>`<div class="card" data-topic="${i}"><span class="badge">${i+1}/${s.topics.length}</span><h3>📖 ${esc(t)}</h3><p>Открыть полный урок</p></div>`).join("")}</div>`;document.querySelectorAll("[data-topic]").forEach(x=>x.onclick=()=>openLesson(n,+x.dataset.topic))}
async function openLesson(n,i){const topic=state.course[n].topics[i];screen(`topic:${n}:${i}`);content.innerHTML='<div class="spinner">Загрузка урока…</div>';try{const d=await api(`/api/lesson/${n}/${i}`);const g=d.guide||{};content.innerHTML=bar(`📖 ${d.topic}`,()=>openSection(n))+`<article class="lesson"><div>${d.html}</div><hr><section class="panel"><b>🧭 Как изучить тему глубже</b><ol><li>Перепиши пример руками.</li><li>Измени минимум два значения.</li><li>Предскажи результат до запуска.</li><li>Сломай одну строку и прочитай ошибку.</li><li>Реши практическую задачу по теме.</li><li>Попробуй объяснить тему вслух своими словами.</li></ol></section><div class="grid" style="margin-top:10px"><div class="panel"><b>🧠 Глубокое понимание</b><p>${esc(g.core||"Сформулируй вход, действие и результат.")}</p></div><div class="panel"><b>🎯 Зачем это нужно</b><p>${esc(g.why||"Свяжи тему с одной реальной задачей проекта.")}</p></div><div class="panel"><b>⚠️ Типичные ошибки</b><ul>${(g.mistakes||["Не копируй пример без эксперимента.","Проверяй типы и входные данные.","Читай traceback."]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="panel"><b>🧪 Самостоятельная задача</b><p>${esc(g.practice||"Измени пример и сделай собственный вариант.")}</p></div></div><div class="row" style="margin-top:12px">${d.prev?`<button class="btn" id="prev">← ${esc(d.prev.title)}</button>`:""}${d.next?`<button class="btn primary" id="next">${esc(d.next.title)} →</button>`:""}</div><button class="btn primary wide" style="margin-top:10px" id="lessonPractice">🧪 Практика по теме</button></article>`;$("prev")?.addEventListener("click",()=>openLesson(d.prev.section,d.prev.index));$("next")?.addEventListener("click",()=>openLesson(d.next.section,d.next.index));$("lessonPractice").onclick=()=>practice("tasks")}catch(e){content.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

function practice(mode="tasks",filter="all"){screen("practice");content.innerHTML=bar("🧪 Практика")+`<div class="chips"><button class="chip ${mode==="tasks"?"active":""}" data-p="tasks">📝 Задания</button><button class="chip ${mode==="quiz"?"active":""}" data-p="quiz">🧠 Викторина</button><button class="chip ${mode==="mini"?"active":""}" data-p="mini">💡 Мини-коды</button><button class="chip ${mode==="trainer"?"active":""}" data-p="trainer">💻 Редактор</button><button class="chip ${mode==="projects"?"active":""}" data-p="projects">🚀 Проекты</button></div><div id="practiceBody"></div>`;document.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>practice(x.dataset.p));if(mode==="tasks")renderTasks(filter);else if(mode==="quiz")renderQuiz();else if(mode==="mini")mini();else if(mode==="trainer")trainer();else projects()}
function renderTasks(filter="all"){screen("practice:tasks");const filtered=state.tasks.filter(t=>filter==="all"||t.difficulty.includes(filter));$("practiceBody").innerHTML=`<div class="chips" style="margin:10px 0"><button class="chip ${filter==="all"?"active":""}" data-f="all">Все</button><button class="chip ${filter==="Легко"?"active":""}" data-f="Легко">🟢 Легко</button><button class="chip ${filter==="Средне"?"active":""}" data-f="Средне">🟡 Средне</button><button class="chip ${filter==="Сложнее"?"active":""}" data-f="Сложнее">🟠 Сложнее</button><button class="chip ${filter==="Продвинуто"?"active":""}" data-f="Продвинуто">🔴 Продвинуто</button><button class="chip" id="randomTask">🎲 Случайное</button></div><div class="grid">${filtered.map(t=>`<div class="card" data-task="${esc(t.id)}"><span class="badge">${esc(t.difficulty)}</span><h3>${esc(t.title)}</h3><p>${esc(t.prompt)}</p></div>`).join("")}</div>`;document.querySelectorAll("[data-f]").forEach(x=>x.onclick=()=>practice("tasks",x.dataset.f));document.querySelectorAll("[data-task]").forEach(x=>x.onclick=()=>openTaskById(x.dataset.task));$("randomTask").onclick=()=>{const x=filtered[Math.floor(Math.random()*filtered.length)];if(x)openTaskById(x.id)}}
function openTaskById(id){const i=state.tasks.findIndex(t=>t.id===id),t=state.tasks[i];content.innerHTML=bar("📝 "+t.title,()=>practice("tasks"))+`<article class="lesson"><span class="badge">${esc(t.difficulty)}</span><h3>Задание</h3><p>${esc(t.prompt)}</p><div class="panel"><b>💡 Подсказка</b><p>${esc(t.hint)}</p></div><button class="btn" id="solution">Показать решение</button> <button class="btn good" id="done">✅ Решено</button><div id="sol"></div></article>`;$("solution").onclick=()=>{$("sol").innerHTML=`<pre class="code">${esc(t.solution)}</pre><button class="btn" id="copyTask">📋 Скопировать</button>`;$("copyTask").onclick=()=>copy(t.solution)};$("done").onclick=async()=>{try{await api("/api/task-complete",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",task_id:t.id})});toast("Задание отмечено") }catch(e){toast(e.message)}}}
function renderQuiz(){screen("practice:quiz");$("practiceBody").innerHTML=`<section class="hero"><h3>🧠 Викторина</h3><p>Один код, одна ошибка, четыре варианта ответа.</p><button class="btn primary" id="startQuiz">▶ Начать</button></section><div class="grid">${state.quizzes.map((q,i)=>`<div class="card"><span class="badge">${i+1}/${state.quizzes.length}</span><h3>${esc(q.title)}</h3><p>Найти и исправить ошибку</p></div>`).join("")}</div>`;$("startQuiz").onclick=()=>quizOpen(0)}
async function quizOpen(i){const q=state.quizzes[i];screen("practice:quiz:"+q.id);$("practiceBody").innerHTML=bar("🧠 "+q.title,()=>practice("quiz"))+`<article class="codebox"><pre class="code">${esc(q.code)}</pre><h3>Выбери правильное исправление:</h3><div id="quizOptions">${q.options.map((o,j)=>`<button class="option" data-qo="${j}">${j+1}. ${esc(o)}</button>`).join("")}</div><div id="quizFeed"></div></article>`;document.querySelectorAll("[data-qo]").forEach(x=>x.onclick=()=>quizAnswer(q,i,+x.dataset.qo))}
async function quizAnswer(q,i,o){const bs=[...document.querySelectorAll("[data-qo]")];bs.forEach(b=>b.disabled=true);try{const d=await api("/api/quiz",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",quiz_id:q.id,option_index:o})});bs.forEach((b,j)=>{if(j===d.correct_option)b.classList.add("correct");if(j===o&&!d.correct)b.classList.add("wrong")});$("quizFeed").innerHTML=`<div class="panel" style="margin-top:10px"><b>${d.correct?"✅ Правильно":"❌ Неверно"}</b><p>${esc(d.explanation)}</p><button class="btn primary" id="qnext">${i+1<state.quizzes.length?"Следующий":"Готово"}</button></div>`;$("qnext").onclick=()=>i+1<state.quizzes.length?quizOpen(i+1):renderQuiz()}catch(e){$("quizFeed").innerHTML=`<div class="panel">${esc(e.message)}</div>`}}
function mini(){screen("practice:mini");$("practiceBody").innerHTML=`<section class="hero"><h3>💡 Мини-коды</h3><p>Короткие готовые программы для эксперимента.</p></section><div class="grid">${Object.entries(state.miniCodes).map(([k,d])=>`<div class="card" data-mini="${esc(k)}"><span class="badge">${esc(d.category)}</span><h3>${esc(d.title)}</h3><p>${esc(d.description)}</p></div>`).join("")}</div>`;document.querySelectorAll("[data-mini]").forEach(x=>x.onclick=()=>openMini(x.dataset.mini))}
function openMini(k){const d=state.miniCodes[k];content.innerHTML=bar(d.title,()=>practice("mini"))+`<article class="lesson"><p>${esc(d.description)}</p><pre class="code">${esc(d.code)}</pre><button class="btn primary" id="copyMini">📋 Скопировать</button><h3>Результат</h3><p>${esc(d.result)}</p></article>`;$("copyMini").onclick=()=>copy(d.code)}
function trainer(){screen("practice:trainer");const a=[['add_numbers','Функция сложения','def add(a, b):\n    # напиши решение\n    pass'],['even_number','Чётное число','def is_even(n):\n    # напиши решение\n    pass'],['list_sum','Сумма списка','def list_sum(numbers):\n    # напиши решение\n    pass'],['safe_get','Безопасный dict','def get_age(user):\n    # напиши решение\n    pass'],['json_save','JSON','import json\n\ndef save_json(data, filename):\n    # напиши решение\n    pass'],['api_request','GET + JSON','import requests\n\n# напиши решение']];state.trainer=a;$("practiceBody").innerHTML=`<section class="hero"><h3>💻 Редактор кода</h3><p>Проверяем синтаксис и структуру через AST. Пользовательский код сервер не выполняется.</p></section><div class="grid">${a.map((t,i)=>`<div class="card" data-tr="${i}"><h3>${esc(t[1])}</h3><p>Написать решение</p></div>`).join("")}</div>`;document.querySelectorAll("[data-tr]").forEach(x=>x.onclick=()=>trainerOpen(+x.dataset.tr))}
function trainerOpen(i){const t=state.trainer[i];content.innerHTML=bar("💻 "+t[1],()=>practice("trainer"))+`<article class="codebox"><textarea id="editor" class="editor">${esc(t[2])}</textarea><div class="row" style="margin-top:9px"><button class="btn primary" id="check">▶ Проверить</button><button class="btn" id="reset">↻ Сбросить</button></div><div id="feed"></div></article>`;$("check").onclick=async()=>{try{const d=await api("/api/code-check",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",task_id:t[0],code:$("editor").value})});$("feed").innerHTML=`<div class="panel" style="margin-top:10px"><b>${d.passed?"✅ Выполнено":"❌ Пока нет"}</b><p>${esc(d.message)}</p><p class="small">${esc(d.hint||"")}</p></div>`}catch(e){$("feed").innerHTML=`<div class="panel">${esc(e.message)}</div>`}};$("reset").onclick=()=>{$("editor").value=t[2];$("feed").innerHTML=""}}
function projects(){screen("practice:projects");const p=[['bot','🤖 Telegram-бот',['Bot','Handlers','Кнопки','SQLite','FSM','Mini App','Deploy']],['web','🌐 Web API',['HTTP','Маршруты','GET/POST','JSON','БД','Тесты','Deploy']],['data','📊 Data',['NumPy','Pandas','Графики','Анализ','Отчёт']],['game','🎮 Игра',['Цикл','Состояние','Очки','UI','Полировка']],['auto','⚙️ Автоматизация',['Файлы','API','Парсер','Ошибки','Отчёт']]];$("practiceBody").innerHTML=`<div class="grid">${p.map((x,i)=>`<div class="card" data-proj="${i}"><h3>${x[1]}</h3><p>${x[2].length} этапов</p></div>`).join("")}</div>`;document.querySelectorAll("[data-proj]").forEach(x=>x.onclick=()=>projectOpen(p[+x.dataset.proj]))}
function projectOpen(p){content.innerHTML=bar(p[1],()=>practice("projects"))+`<article class="lesson"><p>Большой проект — это последовательность маленьких рабочих шагов.</p>${p[2].map((x,i)=>`<div class="project"><b>${i+1}</b><span>${esc(x)}</span><span style="margin-left:auto">${i===0?'▶':'🔒'}</span></div>`).join("")}<div class="panel" style="margin-top:10px"><b>📌 Правило</b><p>Сначала минимальная рабочая версия, затем следующий слой. Пиши README и фиксируй изменения в Git.</p></div></article>`}

async function progress(){screen("progress");content.innerHTML='<div class="spinner">Считаем прогресс…</div>';try{const d=await api("/api/progress",{method:"POST",body:JSON.stringify({initData:tg?.initData||""})});const p=d.total?Math.round(d.done/d.total*100):0;content.innerHTML=bar("📊 "+T("progress"))+`<section class="hero"><b>${d.done}/${d.total} тем · ${p}%</b><div class="bar" style="margin-top:10px"><div class="fill" style="width:${p}%"></div></div></section><div class="stats"><div class="stat"><b>${d.tasks_done}</b><span>задач решено</span></div><div class="stat"><b>${d.quiz_correct}/${d.quiz_total}</b><span>викторина</span></div><div class="stat"><b>${d.code_passed}/${d.code_attempts}</b><span>редактор</span></div><div class="stat"><b>${d.quiz_errors.length}</b><span>слабых тем</span></div></div><section class="hero"><h3>🧠 Анализ ошибок</h3>${d.quiz_errors.map(x=>`<div class="kpi"><span>${esc(x.title)}</span><b>${x.errors} ошибок</b></div>`).join("")||'<p class="small">Ошибок пока нет. Продолжай практику.</p>'}<div class="panel" style="margin-top:10px"><b>🎯 Рекомендация</b><p>${d.quiz_errors.length?"Вернись к темам с наибольшим количеством ошибок и реши задания по ним.":"Пройди первую викторину и несколько практических задач, чтобы система увидела твои сильные и слабые места."}</p></div></section>`}catch(e){content.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

async function searchView(){screen("search");content.innerHTML=bar("🔎 "+T("search"))+`<div class="row"><input id="q" class="input" placeholder="Урок, фреймворк, библиотека, мини-код…"><button class="btn primary" id="doSearch">Найти</button></div><div id="res"></div>`;const run=()=>{const q=$("q").value.trim().toLowerCase(),out=[];for(const [n,s] of Object.entries(state.course))for(let i=0;i<s.topics.length;i++){const t=s.topics[i];if(!q||(`${t} ${s.title}`).toLowerCase().includes(q))out.push({kind:"Урок",title:t,fn:()=>openLesson(+n,i)})}for(const [k,d] of Object.entries(state.frameworks))if(!q||(`${d.name} ${d.desc}`).toLowerCase().includes(q))out.push({kind:"Фреймворк",title:d.name,fn:()=>openTech("framework",k,d.category)});for(const [k,d] of Object.entries(state.libraries))if(!q||(`${d.name} ${d.desc}`).toLowerCase().includes(q))out.push({kind:"Библиотека",title:d.name,fn:()=>openTech("library",k,d.category)});for(const [k,d] of Object.entries(state.miniCodes))if(!q||(`${d.title} ${d.description}`).toLowerCase().includes(q))out.push({kind:"Мини-код",title:d.title,fn:()=>openMini(k)});$("res").innerHTML=out.slice(0,100).map((x,i)=>`<div class="result" data-res="${i}"><span class="badge">${esc(x.kind)}</span><h3>${esc(x.title)}</h3></div>`).join("")||'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll("[data-res]").forEach(x=>x.onclick=out[+x.dataset.res].fn)};$("doSearch").onclick=run;$("q").oninput=run;run()}

async function mentor(){screen("mentor");content.innerHTML=bar("🤖 "+T("mentor"))+`<section class="hero"><p>Поиск по курсу, дополнительным урокам, фреймворкам и библиотекам.</p><textarea id="mentorQ" class="textarea" placeholder="Например: объясни циклы проще"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="mAsk">Спросить</button><button class="btn" id="mSimple">Проще</button><button class="btn" id="mAnalogy">Аналогия</button></div></section><div id="mAnswer"></div>`;const ask=async mode=>{const q=$("mentorQ").value.trim();if(!q)return toast("Напиши вопрос");$("mAnswer").innerHTML='<div class="spinner">Наставник ищет…</div>';try{const d=await api("/api/mentor",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",query:q,mode})});$("mAnswer").innerHTML=`<section class="hero"><h3>💬 Ответ</h3><p>${esc(d.answer)}</p><h4>📚 Связанные материалы</h4>${(d.suggestions||[]).map((s,i)=>`<div class="result" data-ms="${i}">${esc(s.title)}</div>`).join("")||'<p class="small">Связанных материалов нет.</p>'}</section>`;document.querySelectorAll("[data-ms]").forEach(x=>{const s=d.suggestions[+x.dataset.ms];if(s.kind==="framework")x.onclick=()=>openTech("framework",s.key,state.frameworks[s.key]?.category);else if(s.kind==="library")x.onclick=()=>openTech("library",s.key,state.libraries[s.key]?.category);else{const sec=state.course[s.key];const idx=sec?.topics?.indexOf(s.title);if(idx>=0)x.onclick=()=>openLesson(+s.key,idx)}})}catch(e){$("mAnswer").innerHTML=`<div class="empty">${esc(e.message)}</div>`}};$("mAsk").onclick=()=>ask("explain");$("mSimple").onclick=()=>ask("simple");$("mAnalogy").onclick=()=>ask("analogy")}

async function support(){screen("support");content.innerHTML=bar("🆘 "+T("support"))+`<section class="hero"><h3>Новое обращение</h3><textarea id="supportText" class="textarea" placeholder="Вопрос, ошибка или предложение"></textarea><button class="btn primary wide" id="sendSupport" style="margin-top:9px">📨 ${T("send")}</button></section><section class="hero"><h3>📬 История обращений</h3><div id="tickets"><div class="spinner">Загрузка…</div></div></section>`;$("sendSupport").onclick=async()=>{const text=$("supportText").value.trim();if(!text)return toast("Напиши сообщение");try{const d=await api("/api/support",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:"create",text})});toast("Обращение #"+d.ticket_id);support()}catch(e){toast(e.message)}};try{const d=await api("/api/support",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:"list"})});$("tickets").innerHTML=(d.tickets||[]).map(t=>`<div class="ticket ${t.status==="answered"?"support-answered":"support-open"}" style="padding:12px;margin-top:8px"><b>#${t.id} · ${esc(t.status)}</b><div class="small">${esc(t.created_at)}</div><p>${esc(t.text)}</p>${t.reply_text?`<div class="panel"><b>Ответ администратора:</b><br>${esc(t.reply_text)}</div>`:'<span class="small">Ожидает ответа.</span>'}</div>`).join("")||'<div class="empty">Пока нет обращений.</div>'}catch(e){$("tickets").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

async function settings(){screen("settings");content.innerHTML=bar("⚙️ "+T("settings"))+`<section class="hero"><div class="setting"><b>🌐 ${T("language")}</b><div class="chips" style="margin-top:8px"><button class="chip ${state.settings.language==="ru"?"active":""}" id="ru">🇷🇺 Русский</button><button class="chip ${state.settings.language==="en"?"active":""}" id="en">🇬🇧 English</button></div></div><div class="setting"><b>🎨 ${T("theme")}</b><div class="chips" style="margin-top:8px"><button class="chip ${state.settings.theme==="system"?"active":""}" data-th="system">${T("system")}</button><button class="chip ${state.settings.theme==="dark"?"active":""}" data-th="dark">${T("dark")}</button><button class="chip ${state.settings.theme==="light"?"active":""}" data-th="light">${T("light")}</button></div></div><div class="setting"><b>🔔 ${T("notifications")}</b><div class="row" style="margin-top:8px"><button class="chip ${state.settings.notifications_enabled?"active":""}" id="notif">${state.settings.notifications_enabled?"Включены":"Выключены"}</button><input id="reminder" type="time" class="input" value="${esc(state.settings.reminder_time||"19:00")}" style="max-width:140px"></div><p class="small">Если включено, бот присылает одно мягкое напоминание в выбранное время по часам сервера.</p></div><div class="setting"><b>▶️ ${T("resume")}</b><div class="chips" style="margin-top:8px"><button class="chip ${state.settings.resume_enabled?"active":""}" id="resume">${state.settings.resume_enabled?"Включено":"Выключено"}</button></div></div><div class="setting"><b>🎯 ${T("goal")}</b><div class="grid" style="margin-top:8px">${[["general","🐍 Python"],["web","🌐 Web"],["telegram","🤖 Telegram"],["data","📊 Data"],["games","🎮 Игры"],["automation","⚙️ Автоматизация"]].map(x=>`<button class="goal ${state.settings.goal===x[0]?"active":""}" data-sg="${x[0]}">${esc(x[1])}</button>`).join("")}</div></div></section><section class="hero"><h3>⭐ ${T("favorite")}</h3>${state.favorites.map(x=>`<div class="kpi"><span>${esc(x)}</span><button class="btn" data-rf="${esc(x)}">Удалить</button></div>`).join("")||'<div class="small">Нет сохранённых технологий.</div>'}</section>`;$("ru").onclick=async()=>{state.settings.language="ru";await saveSettings();settings()};$("en").onclick=async()=>{state.settings.language="en";await saveSettings();settings()};document.querySelectorAll("[data-th]").forEach(x=>x.onclick=async()=>{state.settings.theme=x.dataset.th;await saveSettings();settings()});$("notif").onclick=async()=>{state.settings.notifications_enabled=!state.settings.notifications_enabled;await saveSettings();settings()};$("reminder").onchange=async()=>{state.settings.reminder_time=$("reminder").value||"19:00";await saveSettings()};$("resume").onclick=async()=>{state.settings.resume_enabled=!state.settings.resume_enabled;await saveSettings();settings()};document.querySelectorAll("[data-sg]").forEach(x=>x.onclick=async()=>{state.settings.goal=x.dataset.sg;await saveSettings();settings()});document.querySelectorAll("[data-rf]").forEach(x=>x.onclick=async()=>{const [kind,key]=x.dataset.rf.split(":");state.favorites=state.favorites.filter(v=>v!==x.dataset.rf);localStorage.setItem("pyacademy_favorites",JSON.stringify(state.favorites));try{await api("/api/favorites",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:"remove",kind,item_key:key})})}catch{};settings()})}

async function admin(){if(!state.isAdmin)return;screen("admin");content.innerHTML=bar("🛠 "+T("admin"))+`<section class="hero"><div class="row"><button class="btn primary" id="allMsg">👥 Всем</button><button class="btn" id="activeMsg">🟢 Активным</button><button class="btn" id="adminMsg">🛠 Админам</button></div><div class="row" style="margin-top:8px"><button class="chip active" id="allUsers">Все</button><button class="chip" id="onlyActive">Активные</button><input id="adminQuery" class="input" placeholder="ID / username / имя"></div></section><div id="adminStats"></div><div id="adminUsers"><div class="spinner">Загрузка…</div></div><section class="hero" style="margin-top:12px"><h3>🆘 Обращения</h3><div id="adminSupport"><div class="spinner">Загрузка…</div></div></section>`;const broadcast=(action,title)=>{openModal(title,async text=>{const d=await api("/api/admin",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action,text})});toast(`Отправлено: ${d.sent}, ошибок: ${d.failed}`)})};$("allMsg").onclick=()=>broadcast("broadcast_all","📨 Всем пользователям");$("activeMsg").onclick=()=>broadcast("broadcast_active","🟢 Активным пользователям");$("adminMsg").onclick=()=>broadcast("broadcast_admins","🛠 Администраторам");const loadUsers=async mode=>{try{const d=await api("/api/admin",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:mode,query:$("adminQuery").value||""})});$("adminStats").innerHTML=`<div class="stats"><div class="stat"><b>${d.total_users}</b><span>всего</span></div><div class="stat"><b>${mode==="active"?d.active_count:"—"}</b><span>активных</span></div><div class="stat"><b>${d.total_views}</b><span>действий</span></div><div class="stat"><b>${state.frameworks?Object.keys(state.frameworks).length:0}</b><span>фреймворков</span></div></div>`;$("adminUsers").innerHTML=(d.users||[]).map(u=>`<div class="usercard" style="padding:13px;margin-top:8px"><b>${u.username?`@${esc(u.username)}`:"None"}</b><div class="small">ID ${esc(u.user_id)}</div><div class="small">Имя: ${esc(u.first_name||"None")}</div><div class="panel" style="margin-top:8px">📍 <b>Сейчас:</b> ${esc(u.current_tab||"—")}<br><span class="small">${esc(u.current_tab_at||u.last_seen||"—")} · ${esc(u.views_count)} действий</span></div><div class="admin-actions"><button class="btn" data-history="${u.user_id}">👁 История</button><button class="btn primary" data-user-msg="${u.user_id}">✉️ Написать</button></div><div id="hist${u.user_id}"></div></div>`).join("")||'<div class="empty">Пользователей нет.</div>';document.querySelectorAll("[data-history]").forEach(x=>x.onclick=()=>adminHistory(+x.dataset.history));document.querySelectorAll("[data-user-msg]").forEach(x=>x.onclick=()=>openModal("Сообщение пользователю",async text=>{await api("/api/admin",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:"send",user_id:+x.dataset.userMsg,text})});toast("Отправлено")}))}catch(e){$("adminUsers").innerHTML=`<div class="empty">${esc(e.message)}</div>`}};$("allUsers").onclick=()=>loadUsers("users");$("onlyActive").onclick=()=>loadUsers("active");$("adminQuery").oninput=()=>loadUsers("users");loadUsers("users");try{const a=await api("/api/admin",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:"analytics"})});$("adminStats").innerHTML+=`<section class="hero" style="margin-top:10px"><h3>📍 Кто где находится</h3>${(a.current_tabs||[]).map(x=>`<div class="kpi"><span>${esc(x.tab)}</span><b>${x.count}</b></div>`).join("")}<h3 style="margin-top:14px">🔥 Частые действия</h3>${(a.top_views||[]).map(x=>`<div class="kpi"><span>${esc(x.kind)}: ${esc(x.title)}</span><b>${x.count}</b></div>`).join("")}</section>`}catch{}try{const a=await api("/api/admin",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:"support"})});$("adminSupport").innerHTML=(a.tickets||[]).map(t=>`<div class="ticket" style="padding:12px;margin-top:8px"><b>#${t.id} · ${t.username?`@${esc(t.username)}`:"None"}</b><div class="small">ID ${esc(t.user_id)} · ${esc(t.status)}</div><p>${esc(t.text)}</p>${t.reply_text?`<div class="panel">Ответ: ${esc(t.reply_text)}</div>`:`<button class="btn primary" data-reply="${t.id}">Ответить</button>`}</div>`).join("")||'<div class="empty">Нет обращений.</div>';document.querySelectorAll("[data-reply]").forEach(x=>x.onclick=()=>openModal("Ответ на обращение #"+x.dataset.reply,async text=>{await api("/api/admin",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:"support_reply",ticket_id:+x.dataset.reply,text})});toast("Ответ отправлен");admin()}))}catch{} }
async function adminHistory(id){const x=$("hist"+id);x.innerHTML='<div class="spinner">История…</div>';try{const d=await api("/api/admin",{method:"POST",body:JSON.stringify({initData:tg?.initData||"",action:"user",user_id:id})});x.innerHTML=(d.views||[]).map(v=>`<div class="kpi"><span>${esc(v.viewed_at)} · ${esc(v.kind)}</span><b>${esc(v.title)}</b></div>`).join("")||'<div class="small">Нет действий.</div>'}catch(e){x.textContent=e.message}}
function openModal(title,fn){$("modalTitle").textContent=title;$("modalText").value="";$("modal").classList.add("show");window.modalFn=fn}function closeModal(){$("modal").classList.remove("show");window.modalFn=null}$("modalClose").onclick=closeModal;$("modalCancel").onclick=closeModal;$("modalSend").onclick=async()=>{const tx=$("modalText").value.trim();if(!tx)return;try{await window.modalFn(tx);closeModal()}catch(e){toast(e.message)}}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==="home")home();else if(v==="learn")learning();else if(v==="catalog")catalog("framework");else if(v==="practice")practice();else if(v==="mentor")mentor();else if(v==="progress")progress();else if(v==="support")support();else if(v==="admin")admin()});$("searchBtn").onclick=searchView;$("settingsBtn").onclick=settings;
async function init(){loadLocal();try{const d=await api("/api/course");Object.assign(state,{course:d.course||{},frameworks:d.frameworks||{},libraries:d.libraries||{},frameworkGroups:d.framework_groups||[],libraryGroups:d.library_groups||[],miniCodes:d.mini_codes||{},learning:d.learning_plan||[],tasks:d.practice_tasks||[],quizzes:d.quizzes||[],total:d.total_topics||0});$("ver").textContent="v"+(d.app_version||"15").toString().replace(/^v/,"")}catch(e){content.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
 if(tg?.initData){try{const me=await api("/api/me",{method:"POST",body:JSON.stringify({initData:tg.initData})});state.user=me.user;state.isAdmin=!!me.is_admin;if(me.settings)Object.assign(state.settings,me.settings);$("userLine").textContent=state.user?.username?`@${state.user.username}`:(state.user?.first_name||"Telegram");if(state.isAdmin)$("adminTab").style.display="block";try{const f=await api("/api/favorites",{method:"POST",body:JSON.stringify({initData:tg.initData,action:"list"})});state.favorites=(f.favorites||[]).map(x=>`${x.kind}:${x.item_key}`);localStorage.setItem("pyacademy_favorites",JSON.stringify(state.favorites))}catch{}}catch(e){console.warn(e.message)}}setTheme();applyLang();home()}
init();
</script>
</body></html>
